<!doctype html><meta charset="utf-8"><title>Read-only department checks</title>
<button id="run">Run</button><pre id="result"></pre>
<script>
document.getElementById('run').onclick = async () => {
 const result=document.getElementById('result'); const frame=document.createElement('iframe');
 try {
 const loaded=new Promise(resolve=>frame.onload=resolve); frame.src='../index.html';document.body.appendChild(frame);await loaded;
 const doc=frame.contentDocument;
 const tab=doc.querySelector('[data-collection="front-desk"]');
 if(!tab) throw Error('Missing Cath Lab'); tab.click();
 if(doc.getElementById('saveDepartmentBtn')) throw Error('Preset save control exists');
 if(doc.querySelector('[data-action="Delete"]')) throw Error('Preset delete control exists');
 if(!doc.getElementById('clearRecentBtn').disabled) throw Error('Preset clear enabled');
 if(!doc.getElementById('undoRecentBtn').hidden) throw Error('Preset undo visible');
 result.textContent='ALL READ-ONLY DEPARTMENT CHECKS PASSED';
 } catch(error){result.textContent='FAIL: '+error.message;} finally{frame.remove();}
};
</script>
